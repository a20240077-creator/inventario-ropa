<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Inventario de Ropa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-auth">
    <div class="card">
      <h1>Registro</h1>
      <p class="subtexto">Crea tu cuenta para acceder al sistema de inventario de ropa.</p>

      <form id="register-form">
        <div class="grupo-formulario">
          <label for="register-email">Correo electrónico</label>
          <input type="email" id="register-email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="grupo-formulario">
          <label for="register-password">Contraseña</label>
          <input type="password" id="register-password" placeholder="Escribe tu contraseña" required>
        </div>

        <button type="submit" class="btn">Registrarme</button>
      </form>

      <p id="mensaje" class="mensaje"></p>

      <p class="enlace-auth">
        ¿Ya tienes cuenta?
        <a href="login.html">Inicia sesión aquí</a>
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
