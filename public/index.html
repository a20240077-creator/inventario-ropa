<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario de Ropa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-panel inventario-layout">
    <div class="card card-formulario">
      <div class="barra-superior">
        <div>
          <h1>Inventario de Ropa</h1>
          <p class="subtexto">Gestión CRUD de prendas</p>
        </div>
        <button id="btn-logout" class="btn btn-danger">Cerrar sesión</button>
      </div>

      <div class="bloque-info">
        <p><strong>Usuario activo:</strong> <span id="usuario-email"></span></p>
      </div>

      <h2 id="titulo-formulario">Agregar prenda</h2>

      <form id="form-prenda">
        <input type="hidden" id="prenda-id">

        <div class="grupo-formulario">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" required>
        </div>

        <div class="grupo-formulario">
          <label for="categoria">Categoría</label>
          <input type="text" id="categoria" required>
        </div>

        <div class="grupo-formulario">
          <label for="marca">Marca</label>
          <input type="text" id="marca">
        </div>

        <div class="grupo-grid">
          <div class="grupo-formulario">
            <label for="talla">Talla</label>
            <input type="text" id="talla" required>
          </div>

          <div class="grupo-formulario">
            <label for="color">Color</label>
            <input type="text" id="color" required>
          </div>
        </div>

        <div class="grupo-grid">
          <div class="grupo-formulario">
            <label for="stock">Stock</label>
            <input type="number" id="stock" min="0" required>
          </div>

          <div class="grupo-formulario">
            <label for="precio">Precio</label>
            <input type="number" id="precio" min="0" step="0.01" required>
          </div>
        </div>

        <div class="grupo-formulario">
          <label for="codigo_sku">Código SKU</label>
          <input type="text" id="codigo_sku">
        </div>

        <div class="grupo-formulario">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" rows="3"></textarea>
        </div>

        <div class="acciones-formulario">
          <button type="submit" class="btn" id="btn-guardar">Guardar prenda</button>
          <button type="button" class="btn btn-secundario" id="btn-cancelar" style="display: none;">Cancelar edición</button>
        </div>

        <p id="mensaje-prenda" class="mensaje"></p>
      </form>
    </div>

    <div class="card card-tabla">
      <h2>Listado de prendas</h2>
      <div class="tabla-responsive">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Marca</th>
              <th>Talla</th>
              <th>Color</th>
              <th>Stock</th>
              <th>Precio</th>
              <th>SKU</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-prendas">
            <tr>
              <td colspan="10">Cargando prendas...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
