<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Inventario de Ropa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-auth">
    <div class="card">
      <h1>Iniciar sesión</h1>
      <p class="subtexto">Accede al sistema de inventario de ropa.</p>

      <form id="login-form">
        <div class="grupo-formulario">
          <label for="login-email">Correo electrónico</label>
          <input type="email" id="login-email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="grupo-formulario">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" placeholder="Escribe tu contraseña" required>
        </div>

        <button type="submit" class="btn">Entrar</button>
      </form>

      <p id="mensaje" class="mensaje"></p>

      <p class="enlace-auth">
        ¿No tienes cuenta?
        <a href="register.html">Regístrate aquí</a>
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
